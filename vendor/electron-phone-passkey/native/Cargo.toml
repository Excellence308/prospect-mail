[package]
name = "phone-passkey-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
libwebauthn = { git = "https://github.com/linux-credentials/libwebauthn.git", rev = "efa374d6303eb1ebeff373878fa76736f3d2c308" }
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
